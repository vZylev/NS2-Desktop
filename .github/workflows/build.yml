name: Build desktop releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: windows-2022
            executable: dist/NS2-Desktop.exe
          - target: linux-x64
            os: ubuntu-22.04
            executable: dist/NS2-Desktop-linux-x64
          - target: darwin-x64
            os: macos-15-intel
            executable: dist/NS2-Desktop-darwin-x64
          - target: darwin-arm64
            os: macos-15
            executable: dist/NS2-Desktop-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up the SEA-compatible Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up packaging Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Linux packaging tools
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm cpio squashfs-tools desktop-file-utils

      - name: Check version and release tag
        run: |
          node <<'JS'
          const version = require('./package.json').version;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw Error('Unsupported release version');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== 'v' + version)
            throw Error('Tag must match package.json: v' + version);
          const lock = require('./package-lock.json');
          if (lock.version !== version || lock.packages[''].version !== version)
            throw Error('package-lock.json version differs; run npm install --package-lock-only');
          JS

      - name: Install locked build dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build native executable
        run: node desktop/build.cjs --target "${{ matrix.target }}"

      - name: Test packaged runtime and local interface
        run: node desktop/smoke-build.cjs "${{ matrix.executable }}"

      - name: Package executable, source, licenses and checksums
        run: python .github/scripts/package_release.py --target "${{ matrix.target }}"

      - name: Upload downloadable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NS2-Desktop-${{ matrix.target }}-${{ github.sha }}
          path: dist/release/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all tested platform builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: NS2-Desktop-*-${{ github.sha }}
          merge-multiple: true
          path: release

      - name: Verify downloaded assets
        working-directory: release
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          assets = {}
          targets = ('win-x64', 'linux-x64', 'darwin-x64', 'darwin-arm64')
          for target in targets:
              manifest = json.loads(Path('build-info-' + target + '.json').read_text())
              assert manifest['target'] == target and manifest['commit'] == os.environ['EXPECTED_COMMIT']
              for line in Path('SHA256SUMS-' + target).read_text().splitlines():
                  checksum, name = line.split('  ', 1)
                  assert Path(name).name == name and name not in assets
                  with open(name, 'rb') as stream:
                      assert hashlib.file_digest(stream, 'sha256').hexdigest() == checksum, name
                  assets[name] = checksum
          assert {p.name for p in Path('.').iterdir() if not p.name.startswith('SHA256SUMS-')} == set(assets)
          Path('SHA256SUMS').write_text(''.join(assets[name] + '  ' + name + '\n' for name in sorted(assets)))
          PYTHON

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "Release already published; its assets will not be replaced."
              exit 0
            fi
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "NS2 Desktop $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
